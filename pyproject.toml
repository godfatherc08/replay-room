[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-room"
version = "0.1.0"
description = "Moment-first, explainable 3D match intelligence (Microsoft x Premier League 'Inside the Game')."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "pydantic>=2.6,<3",
    "socceraction==1.5.3",
    # socceraction 1.5.3 pins pandera 0.17, which breaks on multimethod>=2.
    "multimethod<2",
    # the engine's MCP server (and the client the agents and the smoke test use); httpx for Azure AI REST calls
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The model agents (Analyst, Storyteller) on Microsoft Agent Framework + Foundry. Imported lazily: the
# deterministic floors (rule plan, composer) need none of it.
foundry = ["agent-framework-core>=1.23,<2", "agent-framework-foundry>=1.15,<2", "azure-identity>=1.17",
           "tenacity>=9.1.4,<9.2"]  # the MCP tool the Analyst uses needs it
agents = ["replay-room[foundry]"]

[project.scripts]
replay = "replay_room.replay.__main__:main"
replay-gen = "replay_room.ingest.generator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:multimethod", "ignore::DeprecationWarning:pandera"]
